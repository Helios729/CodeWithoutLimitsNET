# Netlify configuration for codewithoutlimits.net
#
# The site is a static single-page app. Every dynamic operation goes to the
# Railway API over HTTPS, so no secrets are needed at build time beyond the
# public API URL.

[build]
  base = "."
  command = "npm ci && npm run build:web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include-workspace-root"

# Single-page app routing: unknown paths render index.html so React Router
# can resolve them. Status 200, not 301, or deep links lose their path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Serve the apex domain as canonical and send www to it.
[[redirects]]
  from = "https://www.codewithoutlimits.net/*"
  to = "https://codewithoutlimits.net/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    # connect-src is the important line: the browser will only let this site
    # talk to the Railway API, so an injected script cannot quietly ship
    # learner data to a third-party endpoint.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.codewithoutlimits.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Keep source maps out of the published bundle.
[[headers]]
  for = "/*.map"
  [headers.values]
    X-Robots-Tag = "noindex"
