<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Code Without Limits</title>
    <meta
      name="description"
      content="Free, source-cited courses in AI, programming and the web. Built to work on slow connections and modest devices."
    />
    <link rel="canonical" href="https://codewithoutlimits.net/" />
    <meta property="og:title" content="Code Without Limits" />
    <meta property="og:description" content="Free, source-cited courses in AI, programming and the web." />
    <meta property="og:url" content="https://codewithoutlimits.net/" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#F1E6D3" />

    <!-- Fonts are preconnected but not render-blocking. On a slow connection
         the page paints in the fallback stack first, which is the right
         trade-off for the audience this is built for. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=DM+Sans:wght@400;500&display=swap"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Code Without Limits",
        "url": "https://codewithoutlimits.net",
        "parentOrganization": [
          { "@type": "Organization", "name": "Mondial Connections" },
          { "@type": "Organization", "name": "Community Changers" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Code Without Limits needs JavaScript to run the lessons. The full course text is also
      available as printable handouts; write to us and we will send them.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
